; ESP32 sensor monitor firmware
;
;   pio run                       build the firmware
;   pio run -t upload             flash over USB
;   pio device monitor            serial monitor

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    mikalhart/TinyGPSPlus@^1.1.0

; Standalone GPS test, kept out of the main firmware until it is proven:
;   pio run -e gps_test -t upload && pio device monitor -e gps_test
[env:gps_test]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
build_src_filter = -<*> +<../gps_test/gps_test.cpp>
lib_deps =
    mikalhart/TinyGPSPlus@^1.1.0
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
