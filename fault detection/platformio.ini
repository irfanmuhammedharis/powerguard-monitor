; PowerGuard field unit - ESP32 firmware
;
;   pio run                       build the firmware
;   pio run -t upload             flash over USB
;   pio device monitor            serial console + calibration CLI (type "help")
;   pio test -e native            host-side unit tests of the measurement/fault logic
;
; Copy include/secrets.example.h to include/secrets.h and fill it in before building.

[platformio]
default_envs = esp32dev

[env:esp32dev]
; Pinned so builds are reproducible and work offline once installed.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=1

; Host-side tests for lib/powerguard_core (no hardware, no Arduino).
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DUNITY_INCLUDE_DOUBLE
